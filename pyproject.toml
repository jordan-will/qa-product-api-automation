[project]
name = "p2-product-api-automation"
version = "0.1.0"
description = "API test automation project for the DummyJSON Products API"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0,<10.0",
    "requests>=2.32,<3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"